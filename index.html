<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌布背單字 — 支援</title>
<style>
  :root { --paper:#F5EFE4; --ink:#33302B; --sub:#6B655C; --rule:#DDD3C2; --accent:#B4562F; --card:#FBF7EF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
    line-height:1.8; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:720px; margin:0 auto; padding:56px 24px 80px; }
  .brand { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .brand .dot { width:44px; height:44px; border-radius:11px; background:var(--card);
    border:1px solid var(--rule); display:grid; place-items:center; font-size:22px; color:var(--accent); font-weight:700; }
  h1 { font-size:27px; margin:0; letter-spacing:.02em; }
  .tag { color:var(--sub); font-size:15px; margin:2px 0 34px; }
  h2 { font-size:19px; margin:34px 0 10px; padding-top:8px; border-top:1px solid var(--rule); }
  p, li { font-size:16px; color:#413D37; }
  .card { background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:18px 20px; margin:14px 0; }
  .q { font-weight:600; margin:0 0 4px; }
  a { color:var(--accent); }
  .mail { display:inline-block; margin-top:6px; font-size:17px; font-weight:600; }
  .foot { margin-top:48px; padding-top:16px; border-top:1px solid var(--rule); color:var(--sub); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="dot">Ｅ</div><h1>桌布背單字</h1></div>
  <div class="tag">亮屏就背多益・商業單字 · 支援中心</div>

  <h2>聯絡我們</h2>
  <p>有任何問題、建議或錯誤回報,歡迎直接來信,我們會盡快回覆:</p>
  <a class="mail" href="mailto:poyu0318@gmail.com">poyu0318@gmail.com</a>

  <h2>常見問題</h2>

  <div class="card">
    <p class="q">桌布怎麼每天自動換?</p>
    <p>打開 App →「設定桌布」→「一鍵加入捷徑」,或直接點 <a href="https://www.icloud.com/shortcuts/57639cc637bc4634a6232efbf6be1749">加入捷徑</a>(需先裝 App)。點一下捷徑就換單字;要每天自動換,在捷徑 App「自動化」設個時間。</p>

  <div class="foot">© 2026 Poyu Chiang · 桌布背單字</div>
</div>
</body>
</html>
